[project]
name = "starbucks-project"
version = "0.1.0"
description = "Starbucks offer targeting: segmentation, causal inference, and a send-time offer response model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
